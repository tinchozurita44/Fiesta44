/* ========================================
   CONFIGURACIÓN GENERAL
======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #08090b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow-x: hidden;
}


/* ========================================
   FONDO
======================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(215,170,45,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 60%,
            rgba(215,170,45,.08),
            transparent 30%
        ),

            circle at 90% 80%,
            rgba(215,170,45,.08),
            transparent 30%

    pointer-events: none;

    z-index: -1;

}


/* ========================================
   CONTENEDOR
======================================== */

.container {

    max-width: 700px;

    margin: auto;

    padding: 40px 20px 80px;

}


/* ========================================
   PARTÍCULAS DORADAS
======================================== */

.particle {

    position: fixed;

    width: 6px;

    height: 6px;

    background: #e6b93f;

    border-radius: 50%;

    box-shadow: 0 0 15px #e6b93f;

    animation: float 7s infinite ease-in-out;

    pointer-events: none;

    z-index: -1;

}


.p1 {
    top: 15%;
    left: 8%;
}


.p2 {
    top: 28%;
    right: 10%;
    animation-delay: 2s;
}


.p3 {
    top: 55%;
    left: 15%;
    animation-delay: 4s;
}


.p4 {
    top: 72%;
    right: 12%;
    animation-delay: 1s;
}


.p5 {
    top: 90%;
    left: 45%;
    animation-delay: 3s;
}


@keyframes float {

    0% {

        transform:
            translateY(0)
            scale(1);

        opacity: .3;

    }


    50% {

        transform:
            translateY(-35px)
            scale(1.8);

        opacity: 1;

    }


    100% {

        transform:
            translateY(0)
            scale(1);

        opacity: .3;

    }

}


/* ========================================
   ANIMACIONES
======================================== */

.fade {

    opacity: 0;

    transition:
        opacity 1s ease,

}


.fade.show {

    opacity: 1;

        translateY(0);

}
