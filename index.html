<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tincho Zurita | 44 Años</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================
   FONDO ANIMADO
========================= */

.glow {
    position: fixed;
    width: 500px;
    height: 500px;

    background: radial-gradient(
        circle,
        rgba(210, 170, 50, 0.25),
        rgba(210, 170, 50, 0.08),
        transparent 70%
    );

    border-radius: 50%;

    top: 20%;
    left: -200px;

    z-index: 0;

    animation: moverGlow 10s infinite alternate ease-in-out;

    pointer-events: none;
}

@keyframes moverGlow {

    0% {
        transform: translate(0, 0);
    }

    100% {
        transform: translate(400px, 250px);
    }

}


/* =========================
   CONTENIDO PRINCIPAL
========================= */

.container {

    position: relative;

    z-index: 2;

    max-width: 650px;

    margin: auto;

}


/* =========================
   SECCIONES
========================= */

section {

    padding: 60px 25px;

    text-align: center;

}


/* =========================
   PORTADA
========================= */

.portada {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}


.frase-principal {

    color: #d8cba7;

    font-size: 18px;

    letter-spacing: 4px;

    line-height: 1.8;

    margin-bottom: 35px;

    animation: aparecer 2s ease;

}


.nombre {

    font-size: 70px;

    font-weight: bold;

    color: #e0b83e;

    line-height: 0.9;

    text-shadow:

        0 0 10px #e0b83e,

        0 0 30px rgba(224,184,62,0.6);

    animation: zoom 2s ease;

}


.cumple {

    font-size: 22px;

    letter-spacing: 10px;

    color: #dddddd;

    margin-top: 35px;

}


.numero {

    font-size: 160px;

    font-weight: bold;

    color: #e0b83e;

    line-height: 1;

    text-shadow:

        0 0 15px #e0b83e,

        0 0 40px #b88919,

        0 0 70px rgba(224,184,62,0.6);

    animation: brillo 2s infinite alternate;

}


.anos {

    font-size: 48px;

    font-style: italic;

    color: #e0b83e;

}


.linea {

    width: 200px;

    height: 2px;

    background: #e0b83e;

    margin: 40px auto;

}


.mensaje {

    font-size: 25px;

    line-height: 1.5;

    color: #eeeeee;

}


.mensaje strong {

    color: #e0b83e;

}


/* =========================
   TITULOS
========================= */

.titulo {

    color: #e0b83e;

    font-size: 30px;

    margin-bottom: 30px;

}


/* =========================
   TARJETAS
========================= */

.card {

    background:

        linear-gradient(
            145deg,
            rgba(35,35,35,0.95),
            rgba(12,12,12,0.95)
        );

    border:

        1px solid rgba(224,184,62,0.45);

    border-radius: 25px;

    padding: 35px 25px;

    margin: 20px 0;

    box-shadow:

        0 0 30px rgba(224,184,62,0.10);

}


.info {

    font-size: 21px;

    line-height: 1.8;

    color: #eeeeee;

}


.info strong {

    color: #e0b83e;

}


/* =========================
   CUENTA REGRESIVA
========================= */

.countdown {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

}


.time {

    width: 75px;

    background: #111111;

    border:

        1px solid #d8b64c;

    border-radius: 15px;

    padding: 15px 8px;

}


.time span {

    display: block;

    font-size: 28px;

    font-weight: bold;

    color: #e0b83e;

}


.time small {

    color: #aaaaaa;

    font-size: 10px;

}


/* =========================
   BOTON WHATSAPP
========================= */

.boton {

    display: inline-block;

    margin-top: 30px;

    padding: 18px 28px;

    background:

        linear-gradient(
            135deg,
            #e0b83e,
            #b88919
        );

    color: #111111;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;

    border-radius: 50px;

    box-shadow:

        0 0 25px rgba(224,184,62,0.45);

    transition: 0.3s;

}


.boton:active {

    transform: scale(0.95);

}


/* =========================
   MUSICA
========================= */

.music-button {

    position: fixed;

    bottom: 20px;

    right: 20px;

    width: 65px;

    height: 65px;

    border-radius: 50%;

    border: none;

    background: #e0b83e;

    color: #111111;

    font-size: 28px;

    z-index: 20;

    box-shadow:

        0 0 25px rgba(224,184,62,0.7);

}


/* =========================
   CONFETI
========================= */

.confetti {

    position: fixed;

    width: 10px;

    height: 10px;

    top: -20px;

    z-index: 5;

    pointer-events: none;

    animation:

        caer linear infinite;

}


@keyframes caer {

    to {

        transform:

            translateY(110vh)
            rotate(720deg);

    }

}


/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer {

    from {

        opacity: 0;

        transform:

            translateY(30px);

    }

    to {

        opacity: 1;

        transform:

            translateY(0);

    }

}


@keyframes zoom {

    from {

        opacity: 0;

        transform:

            scale(0.5);

    }

    to {

        opacity: 1;

        transform:

            scale(1);

    }

}


@keyframes brillo {

    from {

        text-shadow:

            0 0 10px #e0b83e;

    }

    to {

        text-shadow:

            0 0 25px #e0b83e,

            0 0 60px #e0b83e,

            0 0 90px rgba(224,184,62,0.7);

    }

}


/* =========================
   PIE
========================= */

.final {

    color: #d8cba7;

    font-size: 18px;

    letter-spacing: 3px;

    line-height: 1.8;

}


/* =========================
   CELULARES
========================= */

@media (max-width: 480px) {

    .nombre {

        font-size: 58px;

    }

    .numero {

        font-size: 135px;

    }

    .frase-principal {

        font-size: 16px;

        letter-spacing: 3px;

    }

    .mensaje {

        font-size: 22px;

    }

    .titulo {

        font-size: 26px;

    }

    .info {

        font-size: 19px;

    }

}

</style>

</head>
