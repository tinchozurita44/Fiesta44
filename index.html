* {

}

html {
    scroll-behavior: smooth;
}

body {
    background: #08090b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

/* FONDO ANIMADO */

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #e6bd3d;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 10px #e6bd3d;
    animation: floatParticle linear infinite;
}

@keyframes floatParticle {
    0% {
        transform: translateY(110vh) translateX(0);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    80% {
        opacity: .5;
    }

    100% {
        transform: translateY(-10vh) translateX(100px);
        opacity: 0;
    }
}


/* CONTENEDOR */

.container {
    position: relative;
